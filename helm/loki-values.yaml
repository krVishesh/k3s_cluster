# Loki Helm Values

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 5d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 7Gi

# Disable all distributed components
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable things not needed for single binary
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
